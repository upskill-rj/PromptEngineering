.roadmap-view { }
.timeline-step { display: flex; gap: 14px; margin-bottom: 0; }
.timeline-left { display: flex; flex-direction: column; align-items: center; width: 36px; flex-shrink: 0; }
.tl-dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; flex-shrink: 0; }
.tl-line { width: 1.5px; flex: 1; min-height: 20px; background: var(--color-border-tertiary); margin: 4px 0; }

let selectedPillar = 0;
let currentView = 'pillars';

function showView(v) {
  currentView = v;
  ['pillars','roadmap','metrics'].forEach(id => {
    document.getElementById('view-' + id).style.display = id === v ? 'block' : 'none';
  });
  document.querySelectorAll('.nav button').forEach((b, i) => {
    b.classList.toggle('active', ['pillars','roadmap','metrics'][i] === v);
  });
  if (v === 'roadmap' && !document.getElementById('roadmap-content').innerHTML) renderRoadmap();
  if (v === 'metrics' && !document.getElementById('metrics-content').innerHTML) renderMetrics();
}

function renderPillars() {
  const grid = document.getElementById('pillar-grid');
  grid.innerHTML = pillars.map((p, i) => `
    <div class="pillar-card ${i === selectedPillar ? 'selected' : ''}"
      style="${i === selectedPillar ? `border-color: ${p.barColor}; background: ${p.color}20;` : ''}"
      onclick="selectPillar(${i})">
      <div class="pillar-icon">${p.icon}</div>
      <div class="pillar-name">${p.name}</div>
      <div class="pillar-tag">${p.tag}</div>
    </div>
  `).join('');
  renderDetail(selectedPillar);
}

function selectPillar(i) {
  selectedPillar = i;
  renderPillars();
}

function renderDetail(i) {
  const p = pillars[i];
  const phaseLabels = ['Foundation', 'Practitioner', 'Architect'];
  const phaseClasses = ['phase-0', 'phase-1', 'phase-2', 'phase-3'];
  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-header">
      <div class="detail-icon">${p.icon}</div>
      <div>
        <div class="detail-title">${p.name}</div>
        <div class="detail-subtitle">${p.goal}</div>
      </div>
    </div>
    ${p.phases.map((ph, idx) => `
      <div class="phase-row">
        <div class="phase-badge ${phaseClasses[idx+1]}">${phaseLabels[idx]}</div>
        <div class="phase-content">
          <div class="phase-items">${ph.items.map(it => `<span>${it}</span>`).join('')}</div>
          ${ph.certs.length ? `<div class="certs-row">${ph.certs.map(c => `<div class="cert">🏅 ${c}</div>`).join('')}</div>` : ''}
        </div>
      </div>
    `).join('')}
    <div style="margin-top:12px; padding:12px; background:var(--color-background-secondary); border-radius:var(--border-radius-md);">
      <div style="font-size:12px; font-weight:500; color:var(--color-text-primary); margin-bottom:6px;">Architect deep dive</div>
      <div style="font-size:12px; color:var(--color-text-secondary); line-height:1.7;">${p.deepDive}</div>
    </div>
    <div style="margin-top:10px;">
      <div style="font-size:12px; font-weight:500; color:var(--color-text-secondary); margin-bottom:6px;">Key metrics to own</div>
      <div class="certs-row">${p.keyMetrics.map(m => `<div class="cert" style="border-color:${p.barColor}40; color:${p.textColor};">📊 ${m}</div>`).join('')}</div>
    </div>
    <button class="ask-btn" onclick="sendPrompt('Give me a detailed 30-day learning plan for the ${p.name} pillar as a Solution Architect')">Ask for a 30-day plan for this pillar ↗</button>
  `;
}

        <div style="display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;">

        <div class="tl-desc">${ph.desc}</div>
        <div class="tl-outcome"><strong>Target outcome:</strong> ${ph.outcome}</div>
        <button class="ask-btn" onclick="sendPrompt('Give me detailed resources, projects, and milestones for Phase ${idx+1}: ${ph.title} of the Solution Architect roadmap')">Expand phase ${idx+1} resources ↗</button>
      </div>
    </div>
  `).join('');
}

function renderMetrics() {
  const levels = ['Beginner', 'Practitioner', 'Architect'];
  document.getElementById('metrics-content').innerHTML = `
    <div style="font-size:13px; color:var(--color-text-secondary); margin-bottom:1rem; line-height:1.6;">Track your mastery across all 8 pillars. Update your self-assessment as you grow.</div>
    ${pillars.map((p, i) => {
      const stored = parseInt(localStorage.getItem ? (localStorage.getItem('sa_pillar_'+i) || '0') : '0');
      return `
      <div style="margin-bottom:14px; padding:12px 14px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg);">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
          <div style="font-size:13px; font-weight:500; display:flex; align-items:center; gap:8px;">${p.icon} ${p.name}</div>
          <select id="sel_${i}" style="font-size:11px; padding:2px 6px; border-radius:8px; border:0.5px solid var(--color-border-secondary); background:var(--color-background-secondary); color:var(--color-text-secondary);" onchange="updateLevel(${i},this.value)">
            <option value="0" ${stored===0?'selected':''}>Not started</option>
            <option value="33" ${stored===33?'selected':''}>Foundation</option>
            <option value="66" ${stored===66?'selected':''}>Practitioner</option>
            <option value="100" ${stored===100?'selected':''}>Architect</option>
          </select>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="bar_${i}" style="width:${stored}%; background:${p.barColor};"></div>
        </div>
        <div style="font-size:11px; color:var(--color-text-secondary);">${p.tag}</div>
      </div>
    `}).join('')}
    <button class="ask-btn" style="width:100%; text-align:center; margin-top:6px;" onclick="sendPrompt('Based on my Solution Architect skill gaps, give me a personalized 90-day study plan')">Generate my personalized study plan ↗</button>
  `;
}

function updateLevel(i, v) {
  document.getElementById('bar_'+i).style.width = v+'%';
  try { localStorage.setItem('sa_pillar_'+i, v); } catch(e) {}
}

renderPillars();
</script>
